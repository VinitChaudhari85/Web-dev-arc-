<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let's Discuss About VCT</title>
</head>

<body>
    <h1>Let us discuss about VCT! Tell us about your opinions about various VCT teams, players and more!</h1>

    <div>
        <form action="">
            <div>
                <label for="ign">Tell us about your in game name:</label>
                <input type="text" id="ign" name="ign" placeholder="your name here">
            </div>
            <br>
            <div>
                <label for="birthdate">Select your birthdate:</label>
                <input type="date" id="birthdate" name="birthdate">
            </div>
            <br>
            <div>
                <label for="role">Which role do you play the most?</label>
                <select name="role" id="role">
                    <option value="" selected disabled hidden>select role</option>
                    <option value="duel">Duelist</option>
                    <option value="senti">Sentinel</option>
                    <option value="ctrl">Controller</option>
                    <option value="init">Initiator</option>
                </select>
            </div>
            <br>
            <div>
                <label for="main">Who is your main?</label>
                <select name="main" id="main">
                    <option value="" selected disabled hidden>select your main</option>
                    <option value="astra">astra</option>
                    <option value="breach">breach</option>
                    <option value="brimstone">brimstone</option>
                    <option value="chamber">chamber</option>
                    <option value="clove">clove</option>
                    <option value="cypher">cypher</option>
                    <option value="deadlock">deadlock</option>
                    <option value="fade">fade</option>
                    <option value="gekko">gekko</option>
                    <option value="harbor">harbor</option>
                    <option value="iso">iso</option>
                    <option value="jett">jett</option>
                    <option value="kayo">kayo</option>
                    <option value="killjoy">killjoy</option>
                    <option value="neon">neon</option>
                    <option value="omen">omen</option>
                    <option value="phoenix">phoenix</option>
                    <option value="raze">raze</option>
                    <option value="reyna">reyna</option>
                    <option value="sage">sage</option>
                    <option value="skye">skye</option>
                    <option value="sova">sova</option>
                    <option value="tejo">tejo</option>
                    <option value="viper">viper</option>
                    <option value="vyse">vyse</option>
                    <option value="waylay">waylay</option>
                    <option value="yoru">yoru</option>
                </select>
            </div>
            <br>
            <div>
                <label for="team">Name your favourite team</label>
                <input type="text" name="team" id="team" placeholder="your favourite VCT team">
            </div>
            <br>
            <div>
                <label for="region">According to you which region is the strongest in VCT right now?</label>
                <select name="region" id="region">
                    <option value="" selected disabled hidden>select region</option>
                    <option value="apac">Asia Pacific</option>
                    <option value="na">North America</option>
                    <option value="emea">Europe</option>
                    <option value="cn">China</option>
                </select>
            </div>
            <br>
            <div>
                <label for="player">Who is your favourite player?</label>
                <input type="text" id="player" name="player" placeholder="your favourite player">
            </div>
            <br>
            <div>
                <label for="event">Which event was THE BEST according to you?</label>
                <input type="text" name="event" id="event" placeholder="event name">
            </div>
            <br>
            <div>
                <label for="weapon">Are you a phantom player or vandal player?</label>
                <input type="radio" name="weapon" id="phantom" value="phantom">
                <label for="phantom">Phantom</label>

                <input type="radio" name="weapon" id="vandal" value="vandal">
                <label for="vandal">Vandal</label>
            </div>
            <br>
            <div>
                <label for="skin">Tell us your favourite weapon skin:</label>
                <input type="text" id="skin" name="skin" placeholder="your favourite weapon skin">
            </div>
            <br>
            <div>
                <label for="champs">Who do you think will win the VCT Champions 2025?</label>
                <input type="text" id="champs" name="champs" placeholder="who will win champs?">
            </div>
            <br>
            <div>
                <label for="comments">Tell us more about your comments, hot takes and extras!</label>
                <textarea name="comments" id="comments" placeholder="comments here:" cols="70" rows="5"></textarea>
            </div>
            <p>Thank you for interacting with us ^-^, GGs!</p>
            <div>
                <button type="reset">Reset</button>
            </div>
            <br>
            <div>
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>

</body>

</html>
