<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamically generate and append the divs using javascript (@-@)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading"><h1>Add videos dynamically using javascript :D</h1></div>
    <div class="button-container"><button onclick="addVideo()">Add video</button></div>
    <div class="divs-container">
        <div class="item">
            <div class="thumbnail">
                <img src="prx-masters-win.jpg" alt="video thumbnail">
                <div class="duration"><span>1:56:31</span></div>
            </div>
            <div class="video-info">
                <h1>The uncrowned kings are finally crowned! | PRX vs FNC VCT Masters toronto grand finals.</h1>
                <p>VALORANT Champions Tour . 1.2M views . 1 day ago</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
