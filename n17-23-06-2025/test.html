<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centering a Div</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    body {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 100vh;
      gap: 1rem;
      background: #111;
      padding: 1rem;
      color: white;
    }

    .method {
      border: 2px solid #444;
      padding: 1rem;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 100px;
      height: 100px;
      background: #ff4d4d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 8px;
    }

    /* 1. margin: auto */
    .margin-auto-wrapper {
      height: 100%;
      display: block;
      position: relative;
    }

    .margin-auto-wrapper .box {
      margin: auto;
    }

    /* 2. flexbox */
    .flexbox-wrapper {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 3. grid */
    .grid-wrapper {
      height: 100%;
      display: grid;
      place-items: center;
    }

    h2 {
      font-size: 1rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="method margin-auto-wrapper">
    <h2>margin: auto</h2>
    <div class="box">Box</div>
  </div>

  <div class="method flexbox-wrapper">
    <h2>Flexbox</h2>
    <div class="box">Box</div>
  </div>

  <div class="method grid-wrapper">
    <h2>Grid</h2>
    <div class="box">Box</div>
  </div>
</body>
</html>
