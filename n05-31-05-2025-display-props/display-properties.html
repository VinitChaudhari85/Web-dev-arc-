<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display properties</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        div {
            border: 2px solid black;
        }

        .box-container{
            width: 100vw;
            display: flex;
            justify-content: center;
            background-color: bisque;
        }
        .box1 {
            display: flex;
            justify-content: center;
            padding: 50px;
            width: 30vw;
            margin: 10px;
            background-color: azure;
        }

        .box2 {
            display: flex;
            justify-content: center;
            padding: 50px;
            width: 30vw;
            margin: 10px;
            background-color: aquamarine;
        }

        .box3 {
            display: flex;
            justify-content: center;
            padding: 50px;
            width: 30vw;
            margin: 10px;
            background-color: aqua;
        }
        
    </style>
</head>

<body>
    <h1>Display properties</h1>

    <br>
    <div class="box-container">
        <div class="box1"> Hola, this is box 1.</div>
        <div class="box2"> Yo, this is box 2. </div>
        <div class="box3"> Konichiwa, box 3 desu. </div>
    </div>
    
</body>

</html>
