<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementation of what i learned further...</title>
</head>
<style>

    *{
        margin: 0;
        padding: 0;
    }
    body{
        /* background-color: rgb(86, 86, 86); */
    }
    nav{
        width: 70vw;
        height: 5vh;
        margin: auto;
        margin-top: 5px;
        background-color: rgb(88, 88, 88);
        border: 2px solid black;
        border-radius: 10px;
        box-shadow: 3px 3px 120px 0px;
        display: flex;
        align-items: center;
    }
    ul{
        display: flex;
        justify-content: center;
        width: 100%;
    }
    nav ul li {
        padding:0.4%;
        list-style: inside none;
        text-shadow: 8px 4px 9px;
    }
    nav ul li a{
        color: inherit;
        text-decoration: none;
    }
    nav ul li a:hover{
        color: aliceblue;
    }

</style>
<body>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About us</a></li>
            <li><a href="#">Contact us</a></li>
        </ul>
    </nav>
</body>
</html>
